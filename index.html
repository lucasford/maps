<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balıkesir Harita Uygulaması</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .controls {
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .controls h1 {
            font-size: 20px;
            margin-right: 20px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #d68910;
        }

        .btn-info {
            background: #16a085;
        }

        .btn-info:hover {
            background: #138d75;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .file-label:hover {
            background: #8e44ad;
        }

        .info {
            margin-left: auto;
            font-size: 14px;
        }

        .leaflet-draw-actions a {
            background-color: #fff;
            border: 1px solid #ccc;
            color: #333;
            padding: 4px 8px;
            text-decoration: none;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        .modal-header h2 {
            color: #2c3e50;
            font-size: 22px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-group input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Custom Leaflet Text */
        .leaflet-text-icon {
            background: transparent;
            border: none;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            cursor: move;
        }

        /* Toolbar buttons */
        .custom-toolbar {
            display: flex;
            gap: 5px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h1>Balıkesir Harita Uygulaması</h1>

        <div class="custom-toolbar">
            <button class="btn btn-info" onclick="addCustomCircle()" title="Yarıçap ile Daire Çiz">🔵 Daire</button>
            <button class="btn btn-info" onclick="addHumanIcon()" title="İnsan Simgesi Ekle">🚶 İnsan</button>
            <button class="btn btn-info" onclick="addTextLabel()" title="Text Ekle">📝 Yazı</button>
        </div>

        <button class="btn btn-success" onclick="exportGeoJSON()">GeoJSON İndir</button>
        <button class="btn btn-success" onclick="exportKML()">KML İndir</button>
        <button class="btn btn-success" onclick="exportWKT()">WKT İndir</button>
        <button class="btn btn-success" onclick="exportPDF()">📄 PDF İndir</button>
        <button class="btn btn-danger" onclick="clearAll()">Tümünü Temizle</button>

        <label for="fileInput" class="file-label">GeoJSON Yükle</label>
        <input type="file" id="fileInput" accept=".geojson,.json" onchange="loadGeoJSON(event)">

        <div class="info">
            <span id="featureCount">Çizim: 0</span>
        </div>
    </div>

    <div id="map"></div>

    <!-- Circle Modal -->
    <div id="circleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCircleModal()">&times;</span>
            <div class="modal-header">
                <h2>Daire Çiz</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="circleRadius">Yarıçap (metre):</label>
                    <input type="number" id="circleRadius" value="500" min="1" max="100000">
                </div>
                <div class="form-group">
                    <label for="circleColor">Renk:</label>
                    <input type="color" id="circleColor" value="#27ae60">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeCircleModal()">İptal</button>
                <button class="btn btn-success" onclick="startDrawingCircle()">Çiz</button>
            </div>
        </div>
    </div>

    <!-- Human Icon Modal -->
    <div id="humanModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeHumanModal()">&times;</span>
            <div class="modal-header">
                <h2>İnsan Simgesi Ekle</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="iconSize">Boyut:</label>
                    <input type="range" id="iconSize" min="20" max="100" value="40">
                    <span id="iconSizeValue">40px</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeHumanModal()">İptal</button>
                <button class="btn btn-success" onclick="startPlacingHuman()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- Text Modal -->
    <div id="textModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeTextModal()">&times;</span>
            <div class="modal-header">
                <h2>Text Ekle</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="textContent">Yazı:</label>
                    <textarea id="textContent" rows="3" placeholder="Yazınızı buraya girin..."></textarea>
                </div>
                <div class="form-group">
                    <label for="textSize">Boyut:</label>
                    <input type="range" id="textSize" min="12" max="72" value="16">
                    <span id="textSizeValue">16px</span>
                </div>
                <div class="form-group">
                    <label for="textFont">Font:</label>
                    <select id="textFont">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Comic Sans MS">Comic Sans MS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="textColor">Renk:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeTextModal()">İptal</button>
                <button class="btn btn-success" onclick="startPlacingText()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- ToGeoJSON for KML export -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // Balıkesir koordinatları: 39.6484° K, 27.8826° D
        const map = L.map('map').setView([39.6484, 27.8826], 12);

        // Altlık harita katmanları
        const baseLayers = {
            "🗺️ OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }),
            "🛰️ Uydu Görünümü": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                maxZoom: 19
            }),
            "🌍 Hibrit (Uydu + Etiketler)": L.layerGroup([
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }),
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19
                })
            ]),
            "🏙️ Esri World Street": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }),
            "🎨 CartoDB Voyager": L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            }),
            "⚪ CartoDB Positron": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            }),
            "⚫ CartoDB Dark Matter": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            })
        };

        // Varsayılan olarak Uydu Görünümü ekle
        baseLayers["🛰️ Uydu Görünümü"].addTo(map);

        // Çizim katmanı
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Katman kontrolü ekle (sağ üst köşede)
        L.control.layers(baseLayers, null, {
            position: 'topright',
            collapsed: false
        }).addTo(map);

        // Çizim kontrolleri
        const drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    drawError: {
                        color: '#e74c3c',
                        message: '<strong>Hata!</strong> Şekiller kesişemez!'
                    },
                    shapeOptions: {
                        color: '#3498db',
                        fillOpacity: 0.3
                    }
                },
                polyline: {
                    shapeOptions: {
                        color: '#e74c3c',
                        weight: 3
                    }
                },
                rectangle: {
                    shapeOptions: {
                        color: '#9b59b6',
                        fillOpacity: 0.3
                    }
                },
                circle: {
                    shapeOptions: {
                        color: '#27ae60',
                        fillOpacity: 0.3
                    }
                },
                circlemarker: false,
                marker: true
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        // Çizim tamamlandığında
        map.on(L.Draw.Event.CREATED, function (event) {
            const layer = event.layer;

            // Daireleri sürüklenebilir yap
            if (layer instanceof L.Circle) {
                layer.dragging = new L.Handler.MarkerDrag(layer);
                layer.dragging.enable();
            }

            drawnItems.addLayer(layer);
            updateFeatureCount();

            // Popup ekle
            if (layer instanceof L.Polygon && !(layer instanceof L.Circle)) {
                const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                layer.bindPopup(`Alan: ${(area / 10000).toFixed(2)} hektar`);
            } else if (layer instanceof L.Circle) {
                const radius = layer.getRadius();
                const area = Math.PI * radius * radius;
                layer.bindPopup(`Yarıçap: ${radius.toFixed(0)} m<br>Alan: ${(area / 10000).toFixed(2)} hektar`);
            } else if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
                let length = 0;
                const latlngs = layer.getLatLngs();
                for (let i = 0; i < latlngs.length - 1; i++) {
                    length += latlngs[i].distanceTo(latlngs[i + 1]);
                }
                layer.bindPopup(`Uzunluk: ${(length / 1000).toFixed(2)} km`);
            }
        });

        // Çizim düzenlendiğinde
        map.on(L.Draw.Event.EDITED, function (event) {
            updateFeatureCount();
        });

        // Çizim silindiğinde
        map.on(L.Draw.Event.DELETED, function (event) {
            updateFeatureCount();
        });

        // Özellik sayısını güncelle
        function updateFeatureCount() {
            const count = Object.keys(drawnItems._layers).length;
            document.getElementById('featureCount').textContent = `Çizim: ${count}`;
        }

        // ============ CUSTOM CIRCLE WITH RADIUS ============
        function addCustomCircle() {
            document.getElementById('circleModal').style.display = 'block';
        }

        function closeCircleModal() {
            document.getElementById('circleModal').style.display = 'none';
        }

        function startDrawingCircle() {
            const radius = parseInt(document.getElementById('circleRadius').value);
            const color = document.getElementById('circleColor').value;

            closeCircleModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                const circle = L.circle(e.latlng, {
                    radius: radius,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.3
                });

                // Daireleri sürüklenebilir yap
                circle.dragging = new L.Handler.MarkerDrag(circle);
                circle.dragging.enable();

                drawnItems.addLayer(circle);

                const area = Math.PI * radius * radius;
                circle.bindPopup(`Yarıçap: ${radius} m<br>Alan: ${(area / 10000).toFixed(2)} hektar`);

                updateFeatureCount();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ HUMAN ICON ============
        function addHumanIcon() {
            document.getElementById('humanModal').style.display = 'block';
        }

        function closeHumanModal() {
            document.getElementById('humanModal').style.display = 'none';
        }

        // Icon size slider
        document.getElementById('iconSize').addEventListener('input', function(e) {
            document.getElementById('iconSizeValue').textContent = e.target.value + 'px';
        });

        function startPlacingHuman() {
            const size = parseInt(document.getElementById('iconSize').value);

            closeHumanModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                const humanIcon = L.divIcon({
                    html: `<div style="font-size: ${size}px; cursor: move;">🚶</div>`,
                    className: 'human-icon',
                    iconSize: [size, size],
                    iconAnchor: [size/2, size]
                });

                const marker = L.marker(e.latlng, {
                    icon: humanIcon,
                    draggable: true
                });

                marker.iconSize = size;

                marker.on('click', function() {
                    const newSize = prompt('Yeni boyut (px):', size);
                    if (newSize && !isNaN(newSize)) {
                        const updatedIcon = L.divIcon({
                            html: `<div style="font-size: ${newSize}px; cursor: move;">🚶</div>`,
                            className: 'human-icon',
                            iconSize: [newSize, newSize],
                            iconAnchor: [newSize/2, newSize]
                        });
                        marker.setIcon(updatedIcon);
                        marker.iconSize = newSize;
                    }
                });

                drawnItems.addLayer(marker);
                updateFeatureCount();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ TEXT LABEL ============
        function addTextLabel() {
            document.getElementById('textModal').style.display = 'block';
        }

        function closeTextModal() {
            document.getElementById('textModal').style.display = 'none';
        }

        // Text size slider
        document.getElementById('textSize').addEventListener('input', function(e) {
            document.getElementById('textSizeValue').textContent = e.target.value + 'px';
        });

        function startPlacingText() {
            const text = document.getElementById('textContent').value;
            const size = parseInt(document.getElementById('textSize').value);
            const font = document.getElementById('textFont').value;
            const color = document.getElementById('textColor').value;

            if (!text) {
                alert('Lütfen bir yazı girin!');
                return;
            }

            closeTextModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                const textIcon = L.divIcon({
                    html: `<div style="font-size: ${size}px; font-family: ${font}; color: ${color}; white-space: nowrap; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;">${text}</div>`,
                    className: 'leaflet-text-icon',
                    iconSize: null
                });

                const marker = L.marker(e.latlng, {
                    icon: textIcon,
                    draggable: true
                });

                marker.textData = { text, size, font, color };

                marker.on('click', function() {
                    const newText = prompt('Yeni yazı:', text);
                    if (newText) {
                        const updatedIcon = L.divIcon({
                            html: `<div style="font-size: ${size}px; font-family: ${font}; color: ${color}; white-space: nowrap; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;">${newText}</div>`,
                            className: 'leaflet-text-icon',
                            iconSize: null
                        });
                        marker.setIcon(updatedIcon);
                        marker.textData.text = newText;
                    }
                });

                drawnItems.addLayer(marker);
                updateFeatureCount();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ EXPORT FUNCTIONS ============

        // GeoJSON export
        function exportGeoJSON() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.geojson`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // KML export
        function exportKML() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            // GeoJSON'dan KML'e dönüştür
            let kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
            kml += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
            kml += '  <Document>\n';
            kml += '    <name>Balıkesir Harita Çizimleri</name>\n';

            data.features.forEach((feature, index) => {
                kml += '    <Placemark>\n';
                kml += `      <name>Çizim ${index + 1}</name>\n`;

                if (feature.geometry.type === 'Polygon') {
                    kml += '      <Polygon>\n';
                    kml += '        <outerBoundaryIs>\n';
                    kml += '          <LinearRing>\n';
                    kml += '            <coordinates>\n';
                    feature.geometry.coordinates[0].forEach(coord => {
                        kml += `              ${coord[0]},${coord[1]},0\n`;
                    });
                    kml += '            </coordinates>\n';
                    kml += '          </LinearRing>\n';
                    kml += '        </outerBoundaryIs>\n';
                    kml += '      </Polygon>\n';
                } else if (feature.geometry.type === 'LineString') {
                    kml += '      <LineString>\n';
                    kml += '        <coordinates>\n';
                    feature.geometry.coordinates.forEach(coord => {
                        kml += `          ${coord[0]},${coord[1]},0\n`;
                    });
                    kml += '        </coordinates>\n';
                    kml += '      </LineString>\n';
                } else if (feature.geometry.type === 'Point') {
                    kml += '      <Point>\n';
                    kml += '        <coordinates>';
                    kml += `${feature.geometry.coordinates[0]},${feature.geometry.coordinates[1]},0`;
                    kml += '</coordinates>\n';
                    kml += '      </Point>\n';
                }

                kml += '    </Placemark>\n';
            });

            kml += '  </Document>\n';
            kml += '</kml>';

            const dataBlob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.kml`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // WKT export
        function exportWKT() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            let wkt = '';

            data.features.forEach((feature, index) => {
                if (index > 0) wkt += '\n\n';

                if (feature.geometry.type === 'Polygon') {
                    wkt += 'POLYGON((';
                    feature.geometry.coordinates[0].forEach((coord, i) => {
                        if (i > 0) wkt += ', ';
                        wkt += `${coord[0]} ${coord[1]}`;
                    });
                    wkt += '))';
                } else if (feature.geometry.type === 'LineString') {
                    wkt += 'LINESTRING(';
                    feature.geometry.coordinates.forEach((coord, i) => {
                        if (i > 0) wkt += ', ';
                        wkt += `${coord[0]} ${coord[1]}`;
                    });
                    wkt += ')';
                } else if (feature.geometry.type === 'Point') {
                    wkt += `POINT(${feature.geometry.coordinates[0]} ${feature.geometry.coordinates[1]})`;
                }
            });

            const dataBlob = new Blob([wkt], { type: 'text/plain' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.wkt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // PDF export
        async function exportPDF() {
            if (Object.keys(drawnItems._layers).length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            // Hide controls temporarily
            const controls = document.querySelector('.controls');
            const originalDisplay = controls.style.display;
            controls.style.display = 'none';

            try {
                // Capture map as image
                const mapElement = document.getElementById('map');
                const canvas = await html2canvas(mapElement, {
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });

                // Create PDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                const imgData = canvas.toDataURL('image/png');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

                // Add title
                pdf.setFontSize(16);
                pdf.setTextColor(0, 0, 0);
                pdf.text('Balıkesir Harita Uygulaması', 10, 10);

                pdf.save(`balikesir_harita_${Date.now()}.pdf`);
            } catch (error) {
                console.error('PDF export error:', error);
                alert('PDF oluşturulurken bir hata oluştu!');
            } finally {
                // Restore controls
                controls.style.display = originalDisplay;
            }
        }

        // Tümünü temizle
        function clearAll() {
            if (confirm('Tüm çizimleri silmek istediğinize emin misiniz?')) {
                drawnItems.clearLayers();
                updateFeatureCount();
            }
        }

        // GeoJSON dosyası yükle
        function loadGeoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const geojson = JSON.parse(e.target.result);

                    // Mevcut çizimleri temizle
                    drawnItems.clearLayers();

                    // GeoJSON'ı haritaya ekle
                    L.geoJSON(geojson, {
                        style: function(feature) {
                            return {
                                color: '#3498db',
                                fillColor: '#3498db',
                                fillOpacity: 0.3,
                                weight: 2
                            };
                        },
                        pointToLayer: function(feature, latlng) {
                            return L.marker(latlng);
                        },
                        onEachFeature: function(feature, layer) {
                            // Her özelliği düzenlenebilir katmana ekle
                            drawnItems.addLayer(layer);

                            // Özellik bilgilerini popup olarak ekle
                            if (feature.properties) {
                                let popupContent = '<div style="max-height: 200px; overflow-y: auto;">';
                                for (let key in feature.properties) {
                                    if (feature.properties[key] !== null && feature.properties[key] !== '') {
                                        popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                                    }
                                }
                                popupContent += '</div>';
                                layer.bindPopup(popupContent);
                            }
                        }
                    });

                    // Haritayı yüklenen veriye yakınlaştır
                    const bounds = drawnItems.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds);
                    }

                    updateFeatureCount();
                    alert('GeoJSON dosyası başarıyla yüklendi!');
                } catch (error) {
                    alert('GeoJSON dosyası yüklenirken hata oluştu: ' + error.message);
                }
            };
            reader.readAsText(file);

            // Input'u sıfırla (aynı dosyanın tekrar yüklenmesine izin ver)
            event.target.value = '';
        }

        // Leaflet GeometryUtil eklentisi (alan hesaplama için)
        L.GeometryUtil = L.extend(L.GeometryUtil || {}, {
            geodesicArea: function (latLngs) {
                let pointsCount = latLngs.length,
                    area = 0.0,
                    d2r = Math.PI / 180,
                    p1, p2;

                if (pointsCount > 2) {
                    for (let i = 0; i < pointsCount; i++) {
                        p1 = latLngs[i];
                        p2 = latLngs[(i + 1) % pointsCount];
                        area += ((p2.lng - p1.lng) * d2r) *
                                (2 + Math.sin(p1.lat * d2r) + Math.sin(p2.lat * d2r));
                    }
                    area = area * 6378137.0 * 6378137.0 / 2.0;
                }

                return Math.abs(area);
            }
        });

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };

        // Sayfa yüklendiğinde özellik sayısını güncelle
        updateFeatureCount();
    </script>
</body>
