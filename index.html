<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balıkesir Harita Uygulaması</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
            width: 100%;
        }

        .controls {
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .controls h1 {
            font-size: 20px;
            margin-right: 20px;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn-success {
            background: #27ae60;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-danger {
            background: #e74c3c;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-warning {
            background: #f39c12;
        }

        .btn-warning:hover {
            background: #d68910;
        }

        .btn-info {
            background: #16a085;
        }

        .btn-info:hover {
            background: #138d75;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background: #9b59b6;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .file-label:hover {
            background: #8e44ad;
        }

        .info {
            margin-left: auto;
            font-size: 14px;
        }

        .leaflet-draw-actions a {
            background-color: #fff;
            border: 1px solid #ccc;
            color: #333;
            padding: 4px 8px;
            text-decoration: none;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        .modal-header h2 {
            color: #2c3e50;
            font-size: 22px;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        .form-group input[type="color"] {
            height: 45px;
            cursor: pointer;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .close-btn {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Custom Leaflet Text */
        .leaflet-text-icon {
            background: transparent;
            border: none;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            cursor: move;
        }

        /* Toolbar buttons */
        .custom-toolbar {
            display: flex;
            gap: 5px;
            margin-right: 10px;
        }

        /* Layer Panel */
        .layer-panel {
            position: fixed;
            right: 0;
            top: 80px;
            width: 350px;
            height: calc(100vh - 80px);
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            transform: translateX(350px);
            transition: transform 0.3s;
            z-index: 1000;
            overflow-y: auto;
        }

        .layer-panel.open {
            transform: translateX(0);
        }

        .layer-panel-header {
            background: #2c3e50;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .layer-panel-toggle {
            position: fixed;
            right: 0;
            top: 100px;
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 10px;
            cursor: pointer;
            border-radius: 5px 0 0 5px;
            z-index: 999;
            font-size: 18px;
            transition: background 0.3s;
        }

        .layer-panel-toggle:hover {
            background: #2980b9;
        }

        .layer-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .layer-item:hover {
            background: #f8f9fa;
        }

        .layer-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .layer-item-title {
            flex: 1;
            font-weight: 600;
            color: #2c3e50;
        }

        .layer-item-actions {
            display: flex;
            gap: 5px;
        }

        .layer-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .layer-btn-toggle {
            background: #27ae60;
            color: white;
        }

        .layer-btn-toggle.hidden {
            background: #95a5a6;
        }

        .layer-btn-delete {
            background: #e74c3c;
            color: white;
        }

        .layer-btn-delete:hover {
            background: #c0392b;
        }

        .layer-btn-color {
            width: 30px;
            height: 30px;
            border: 2px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
        }

        /* PDF Preview Modal */
        .modal-content.large {
            width: 800px;
            max-width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .pdf-preview {
            border: 2px solid #ddd;
            padding: 20px;
            background: white;
            margin: 20px 0;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pdf-preview img {
            max-width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .logo-preview {
            max-width: 200px;
            max-height: 100px;
            margin-top: 10px;
            border: 2px dashed #ddd;
            padding: 10px;
        }

        /* Map container */
        .map-container {
            position: relative;
            flex: 1;
            display: flex;
        }
    </style>
</head>
<body>
    <div class="controls">
        <h1>Balıkesir Harita Uygulaması</h1>

        <div class="custom-toolbar">
            <button class="btn btn-info" onclick="addCustomCircle()" title="Yarıçap ile Daire Çiz">🔵 Daire</button>
            <button class="btn btn-info" onclick="addHumanIcon()" title="İnsan Simgesi Ekle">🚶 İnsan</button>
            <button class="btn btn-info" onclick="addTextLabel()" title="Text Ekle">📝 Yazı</button>
        </div>

        <button class="btn btn-success" onclick="exportGeoJSON()">GeoJSON İndir</button>
        <button class="btn btn-success" onclick="exportKML()">KML İndir</button>
        <button class="btn btn-success" onclick="exportWKT()">WKT İndir</button>
        <button class="btn btn-success" onclick="exportPDF()">📄 PDF İndir</button>
        <button class="btn btn-danger" onclick="clearAll()">Tümünü Temizle</button>

        <label for="fileInput" class="file-label">GeoJSON Yükle</label>
        <input type="file" id="fileInput" accept=".geojson,.json" onchange="loadGeoJSON(event)">

        <div class="info">
            <span id="featureCount">Çizim: 0</span>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>

        <!-- Layer Panel Toggle Button -->
        <button class="layer-panel-toggle" onclick="toggleLayerPanel()" title="Katmanlar">📋</button>

        <!-- Layer Panel -->
        <div class="layer-panel" id="layerPanel">
            <div class="layer-panel-header">
                <h3>Katmanlar</h3>
                <button class="btn btn-danger btn-sm" onclick="toggleLayerPanel()">✕</button>
            </div>
            <div id="layerList"></div>
        </div>
    </div>

    <!-- Circle Modal -->
    <div id="circleModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCircleModal()">&times;</span>
            <div class="modal-header">
                <h2>Daire Çiz</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="circleRadius">Yarıçap (metre):</label>
                    <input type="number" id="circleRadius" value="500" min="1" max="100000">
                </div>
                <div class="form-group">
                    <label for="circleColor">Renk:</label>
                    <input type="color" id="circleColor" value="#27ae60">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeCircleModal()">İptal</button>
                <button class="btn btn-success" onclick="startDrawingCircle()">Çiz</button>
            </div>
        </div>
    </div>

    <!-- Human Icon Modal -->
    <div id="humanModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeHumanModal()">&times;</span>
            <div class="modal-header">
                <h2>İnsan Simgesi Ekle</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="iconSize">Boyut:</label>
                    <input type="range" id="iconSize" min="20" max="100" value="40">
                    <span id="iconSizeValue">40px</span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeHumanModal()">İptal</button>
                <button class="btn btn-success" onclick="startPlacingHuman()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- Text Modal -->
    <div id="textModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeTextModal()">&times;</span>
            <div class="modal-header">
                <h2>Text Ekle</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="textContent">Yazı (Enter ile satır ekleyin):</label>
                    <textarea id="textContent" rows="5" placeholder="Yazınızı buraya girin...&#10;Çok satırlı metin ekleyebilirsiniz"></textarea>
                </div>
                <div class="form-group">
                    <label for="textSize">Boyut:</label>
                    <input type="range" id="textSize" min="12" max="72" value="16">
                    <span id="textSizeValue">16px</span>
                </div>
                <div class="form-group">
                    <label for="textFont">Font:</label>
                    <select id="textFont">
                        <option value="Arial">Arial</option>
                        <option value="Times New Roman">Times New Roman</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                        <option value="Verdana">Verdana</option>
                        <option value="Comic Sans MS">Comic Sans MS</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="textColor">Renk:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeTextModal()">İptal</button>
                <button class="btn btn-success" onclick="startPlacingText()">Ekle</button>
            </div>
        </div>
    </div>

    <!-- PDF Export Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content large">
            <span class="close-btn" onclick="closePDFModal()">&times;</span>
            <div class="modal-header">
                <h2>PDF Önizleme ve Ayarlar</h2>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="pdfTitle">Başlık:</label>
                    <input type="text" id="pdfTitle" value="Balıkesir Harita Raporu" placeholder="PDF başlığını girin">
                </div>
                <div class="form-group">
                    <label for="pdfLogo">Logo (opsiyonel):</label>
                    <input type="file" id="pdfLogo" accept="image/*" onchange="previewLogo(event)" style="display: block;">
                    <div id="logoPreviewContainer"></div>
                </div>
                <div class="form-group">
                    <label>Önizleme:</label>
                    <div class="pdf-preview" id="pdfPreview">
                        <p style="color: #999;">Önizleme oluştur butonuna tıklayın...</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-warning" onclick="generatePreview()">🔍 Önizleme Oluştur</button>
                <button class="btn btn-danger" onclick="closePDFModal()">İptal</button>
                <button class="btn btn-success" onclick="downloadPDF()">📄 PDF İndir</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Draw JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- ToGeoJSON for KML export -->
    <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        // Balıkesir koordinatları: 39.6484° K, 27.8826° D
        const map = L.map('map').setView([39.6484, 27.8826], 12);

        // Altlık harita katmanları
        const baseLayers = {
            "🗺️ OpenStreetMap": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }),
            "🛰️ Uydu Görünümü": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
                maxZoom: 19
            }),
            "🌍 Hibrit (Uydu + Etiketler)": L.layerGroup([
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: 'Tiles &copy; Esri',
                    maxZoom: 19
                }),
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19
                })
            ]),
            "🏙️ Esri World Street": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }),
            "🎨 CartoDB Voyager": L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            }),
            "⚪ CartoDB Positron": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            }),
            "⚫ CartoDB Dark Matter": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                maxZoom: 19
            })
        };

        // Varsayılan olarak Uydu Görünümü ekle
        baseLayers["🛰️ Uydu Görünümü"].addTo(map);

        // Çizim katmanı
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        // Katman kontrolü ekle (sağ üst köşede)
        L.control.layers(baseLayers, null, {
            position: 'topright',
            collapsed: false
        }).addTo(map);

        // Çizim kontrolleri
        const drawControl = new L.Control.Draw({
            position: 'topright',
            draw: {
                polygon: {
                    allowIntersection: false,
                    showArea: true,
                    drawError: {
                        color: '#e74c3c',
                        message: '<strong>Hata!</strong> Şekiller kesişemez!'
                    },
                    shapeOptions: {
                        color: '#3498db',
                        fillOpacity: 0.3
                    }
                },
                polyline: {
                    shapeOptions: {
                        color: '#e74c3c',
                        weight: 3
                    }
                },
                rectangle: {
                    shapeOptions: {
                        color: '#9b59b6',
                        fillOpacity: 0.3
                    }
                },
                circle: {
                    shapeOptions: {
                        color: '#27ae60',
                        fillOpacity: 0.3
                    }
                },
                circlemarker: false,
                marker: true
            },
            edit: {
                featureGroup: drawnItems,
                remove: true
            }
        });
        map.addControl(drawControl);

        // Çizim tamamlandığında
        map.on(L.Draw.Event.CREATED, function (event) {
            const layer = event.layer;

            // Circle'ları sürüklenebilir yap
            if (layer instanceof L.Circle) {
                makeDraggableCircle(layer);
            }

            drawnItems.addLayer(layer);
            updateFeatureCount();
            updateLayerPanel();

            // Popup ekle
            if (layer instanceof L.Polygon && !(layer instanceof L.Circle)) {
                const area = L.GeometryUtil.geodesicArea(layer.getLatLngs()[0]);
                layer.bindPopup(`Alan: ${(area / 10000).toFixed(2)} hektar`);
            } else if (layer instanceof L.Circle) {
                const radius = layer.getRadius();
                const area = Math.PI * radius * radius;
                layer.bindPopup(`Yarıçap: ${radius.toFixed(0)} m<br>Alan: ${(area / 10000).toFixed(2)} hektar`);
            } else if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
                let length = 0;
                const latlngs = layer.getLatLngs();
                for (let i = 0; i < latlngs.length - 1; i++) {
                    length += latlngs[i].distanceTo(latlngs[i + 1]);
                }
                layer.bindPopup(`Uzunluk: ${(length / 1000).toFixed(2)} km`);
            }
        });

        // Çizim düzenlendiğinde
        map.on(L.Draw.Event.EDITED, function (event) {
            updateFeatureCount();
            updateLayerPanel();
        });

        // Çizim silindiğinde
        map.on(L.Draw.Event.DELETED, function (event) {
            updateFeatureCount();
            updateLayerPanel();
        });

        // Özellik sayısını güncelle
        function updateFeatureCount() {
            const count = Object.keys(drawnItems._layers).length;
            document.getElementById('featureCount').textContent = `Çizim: ${count}`;
        }

        // Circle'ı sürüklenebilir yap
        function makeDraggableCircle(circle) {
            let isDragging = false;

            circle.on('mousedown', function(e) {
                isDragging = true;
                map.dragging.disable();
                map.on('mousemove', onMouseMove);
                L.DomEvent.stopPropagation(e);
            });

            function onMouseMove(e) {
                if (isDragging) {
                    circle.setLatLng(e.latlng);
                }
            }

            map.on('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    map.dragging.enable();
                    map.off('mousemove', onMouseMove);
                }
            });
        }

        // ============ CUSTOM CIRCLE WITH RADIUS ============
        function addCustomCircle() {
            document.getElementById('circleModal').style.display = 'block';
        }

        function closeCircleModal() {
            document.getElementById('circleModal').style.display = 'none';
        }

        function startDrawingCircle() {
            const radius = parseInt(document.getElementById('circleRadius').value);
            const color = document.getElementById('circleColor').value;

            closeCircleModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                const circle = L.circle(e.latlng, {
                    radius: radius,
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.3
                });

                // Circle'ı sürüklenebilir yap
                makeDraggableCircle(circle);

                drawnItems.addLayer(circle);

                const area = Math.PI * radius * radius;
                circle.bindPopup(`Yarıçap: ${radius} m<br>Alan: ${(area / 10000).toFixed(2)} hektar`);

                updateFeatureCount();
                updateLayerPanel();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ HUMAN ICON ============
        function addHumanIcon() {
            document.getElementById('humanModal').style.display = 'block';
        }

        function closeHumanModal() {
            document.getElementById('humanModal').style.display = 'none';
        }

        // Icon size slider
        document.getElementById('iconSize').addEventListener('input', function(e) {
            document.getElementById('iconSizeValue').textContent = e.target.value + 'px';
        });

        function startPlacingHuman() {
            const size = parseInt(document.getElementById('iconSize').value);

            closeHumanModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                const humanIcon = L.divIcon({
                    html: `<div style="font-size: ${size}px; cursor: move;">🚶</div>`,
                    className: 'human-icon',
                    iconSize: [size, size],
                    iconAnchor: [size/2, size]
                });

                const marker = L.marker(e.latlng, {
                    icon: humanIcon,
                    draggable: true
                });

                marker.iconSize = size;

                marker.on('click', function() {
                    const newSize = prompt('Yeni boyut (px):', size);
                    if (newSize && !isNaN(newSize)) {
                        const updatedIcon = L.divIcon({
                            html: `<div style="font-size: ${newSize}px; cursor: move;">🚶</div>`,
                            className: 'human-icon',
                            iconSize: [newSize, newSize],
                            iconAnchor: [newSize/2, newSize]
                        });
                        marker.setIcon(updatedIcon);
                        marker.iconSize = newSize;
                    }
                });

                drawnItems.addLayer(marker);
                marker.layerType = 'icon';
                marker.layerName = 'İnsan Simgesi';
                updateFeatureCount();
                updateLayerPanel();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ TEXT LABEL ============
        function addTextLabel() {
            document.getElementById('textModal').style.display = 'block';
        }

        function closeTextModal() {
            document.getElementById('textModal').style.display = 'none';
        }

        // Text size slider
        document.getElementById('textSize').addEventListener('input', function(e) {
            document.getElementById('textSizeValue').textContent = e.target.value + 'px';
        });

        function startPlacingText() {
            const text = document.getElementById('textContent').value;
            const size = parseInt(document.getElementById('textSize').value);
            const font = document.getElementById('textFont').value;
            const color = document.getElementById('textColor').value;

            if (!text) {
                alert('Lütfen bir yazı girin!');
                return;
            }

            closeTextModal();

            map.getContainer().style.cursor = 'crosshair';

            const clickHandler = function(e) {
                // Convert line breaks to <br> tags
                const formattedText = text.replace(/\n/g, '<br>');

                const textIcon = L.divIcon({
                    html: `<div style="font-size: ${size}px; font-family: ${font}; color: ${color}; white-space: pre-wrap; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;">${formattedText}</div>`,
                    className: 'leaflet-text-icon',
                    iconSize: null
                });

                const marker = L.marker(e.latlng, {
                    icon: textIcon,
                    draggable: true
                });

                marker.textData = { text, size, font, color };

                marker.on('click', function() {
                    const newText = prompt('Yeni yazı (Enter için \\n kullanın):', text);
                    if (newText) {
                        const formattedNewText = newText.replace(/\n/g, '<br>');
                        const updatedIcon = L.divIcon({
                            html: `<div style="font-size: ${size}px; font-family: ${font}; color: ${color}; white-space: pre-wrap; text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;">${formattedNewText}</div>`,
                            className: 'leaflet-text-icon',
                            iconSize: null
                        });
                        marker.setIcon(updatedIcon);
                        marker.textData.text = newText;
                    }
                });

                drawnItems.addLayer(marker);
                marker.layerType = 'text';
                marker.layerName = 'Text: ' + (text.substring(0, 20) + (text.length > 20 ? '...' : ''));
                updateFeatureCount();
                updateLayerPanel();

                map.getContainer().style.cursor = '';
                map.off('click', clickHandler);
            };

            map.once('click', clickHandler);
        }

        // ============ EXPORT FUNCTIONS ============

        // GeoJSON export
        function exportGeoJSON() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.geojson`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // KML export
        function exportKML() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            // GeoJSON'dan KML'e dönüştür
            let kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
            kml += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
            kml += '  <Document>\n';
            kml += '    <name>Balıkesir Harita Çizimleri</name>\n';

            data.features.forEach((feature, index) => {
                kml += '    <Placemark>\n';
                kml += `      <name>Çizim ${index + 1}</name>\n`;

                if (feature.geometry.type === 'Polygon') {
                    kml += '      <Polygon>\n';
                    kml += '        <outerBoundaryIs>\n';
                    kml += '          <LinearRing>\n';
                    kml += '            <coordinates>\n';
                    feature.geometry.coordinates[0].forEach(coord => {
                        kml += `              ${coord[0]},${coord[1]},0\n`;
                    });
                    kml += '            </coordinates>\n';
                    kml += '          </LinearRing>\n';
                    kml += '        </outerBoundaryIs>\n';
                    kml += '      </Polygon>\n';
                } else if (feature.geometry.type === 'LineString') {
                    kml += '      <LineString>\n';
                    kml += '        <coordinates>\n';
                    feature.geometry.coordinates.forEach(coord => {
                        kml += `          ${coord[0]},${coord[1]},0\n`;
                    });
                    kml += '        </coordinates>\n';
                    kml += '      </LineString>\n';
                } else if (feature.geometry.type === 'Point') {
                    kml += '      <Point>\n';
                    kml += '        <coordinates>';
                    kml += `${feature.geometry.coordinates[0]},${feature.geometry.coordinates[1]},0`;
                    kml += '</coordinates>\n';
                    kml += '      </Point>\n';
                }

                kml += '    </Placemark>\n';
            });

            kml += '  </Document>\n';
            kml += '</kml>';

            const dataBlob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.kml`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // WKT export
        function exportWKT() {
            const data = drawnItems.toGeoJSON();

            if (data.features.length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }

            let wkt = '';

            data.features.forEach((feature, index) => {
                if (index > 0) wkt += '\n\n';

                if (feature.geometry.type === 'Polygon') {
                    wkt += 'POLYGON((';
                    feature.geometry.coordinates[0].forEach((coord, i) => {
                        if (i > 0) wkt += ', ';
                        wkt += `${coord[0]} ${coord[1]}`;
                    });
                    wkt += '))';
                } else if (feature.geometry.type === 'LineString') {
                    wkt += 'LINESTRING(';
                    feature.geometry.coordinates.forEach((coord, i) => {
                        if (i > 0) wkt += ', ';
                        wkt += `${coord[0]} ${coord[1]}`;
                    });
                    wkt += ')';
                } else if (feature.geometry.type === 'Point') {
                    wkt += `POINT(${feature.geometry.coordinates[0]} ${feature.geometry.coordinates[1]})`;
                }
            });

            const dataBlob = new Blob([wkt], { type: 'text/plain' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `balikesir_${Date.now()}.wkt`;
            link.click();
            URL.revokeObjectURL(url);
        }

        // ============ PDF EXPORT WITH PREVIEW ============
        let pdfPreviewData = null;
        let pdfLogoData = null;

        function exportPDF() {
            if (Object.keys(drawnItems._layers).length === 0) {
                alert('Önce harita üzerinde çizim yapmanız gerekiyor!');
                return;
            }
            document.getElementById('pdfModal').style.display = 'block';
        }

        function closePDFModal() {
            document.getElementById('pdfModal').style.display = 'none';
            pdfPreviewData = null;
        }

        function previewLogo(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                pdfLogoData = e.target.result;
                const container = document.getElementById('logoPreviewContainer');
                container.innerHTML = `<img src="${e.target.result}" class="logo-preview" alt="Logo Preview">`;
            };
            reader.readAsDataURL(file);
        }

        async function generatePreview() {
            const previewDiv = document.getElementById('pdfPreview');
            previewDiv.innerHTML = '<p style="color: #999;">Önizleme oluşturuluyor...</p>';

            try {
                // Hide UI elements
                const controls = document.querySelector('.controls');
                const layerPanel = document.getElementById('layerPanel');
                const layerToggle = document.querySelector('.layer-panel-toggle');

                controls.style.display = 'none';
                layerPanel.style.display = 'none';
                layerToggle.style.display = 'none';

                // Capture map
                const mapElement = document.getElementById('map');
                const canvas = await html2canvas(mapElement, {
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    scale: 2
                });

                pdfPreviewData = canvas.toDataURL('image/png');

                // Show preview
                previewDiv.innerHTML = `<img src="${pdfPreviewData}" alt="PDF Preview" style="max-width: 100%; border: 1px solid #ddd;">`;

                // Restore UI
                controls.style.display = 'flex';
                layerPanel.style.display = '';
                layerToggle.style.display = 'block';

            } catch (error) {
                console.error('Preview error:', error);
                previewDiv.innerHTML = '<p style="color: red;">Önizleme oluşturulamadı!</p>';
            }
        }

        async function downloadPDF() {
            if (!pdfPreviewData) {
                alert('Önce önizleme oluşturun!');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'landscape',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const title = document.getElementById('pdfTitle').value || 'Balıkesir Harita Raporu';

                // Add title and logo area (top 20mm reserved)
                const headerHeight = 20;
                pdf.setFillColor(44, 62, 80);
                pdf.rect(0, 0, pdfWidth, headerHeight, 'F');

                // Add title
                pdf.setTextColor(255, 255, 255);
                pdf.setFontSize(18);
                pdf.text(title, 10, 12);

                // Add date
                pdf.setFontSize(10);
                const date = new Date().toLocaleDateString('tr-TR');
                pdf.text(date, pdfWidth - 50, 12);

                // Add logo if provided
                if (pdfLogoData) {
                    try {
                        pdf.addImage(pdfLogoData, 'PNG', pdfWidth - 50, 3, 40, 14);
                    } catch (e) {
                        console.warn('Logo eklenemedi:', e);
                    }
                }

                // Calculate map dimensions (remaining space)
                const mapWidth = pdfWidth;
                const mapHeight = pdfHeight - headerHeight - 2; // 2mm margin at bottom
                const mapY = headerHeight;

                // Add map image
                pdf.addImage(pdfPreviewData, 'PNG', 0, mapY, mapWidth, mapHeight);

                // Save PDF
                const filename = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                pdf.save(`${filename}_${Date.now()}.pdf`);

                closePDFModal();
                alert('PDF başarıyla indirildi!');

            } catch (error) {
                console.error('PDF download error:', error);
                alert('PDF indirilirken bir hata oluştu!');
            }
        }

        // Tümünü temizle
        function clearAll() {
            if (confirm('Tüm çizimleri silmek istediğinize emin misiniz?')) {
                drawnItems.clearLayers();
                updateFeatureCount();
                updateLayerPanel();
            }
        }

        // GeoJSON dosyası yükle
        function loadGeoJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const geojson = JSON.parse(e.target.result);

                    // Mevcut çizimleri temizle
                    drawnItems.clearLayers();

                    // GeoJSON'ı haritaya ekle
                    L.geoJSON(geojson, {
                        style: function(feature) {
                            return {
                                color: '#3498db',
                                fillColor: '#3498db',
                                fillOpacity: 0.3,
                                weight: 2
                            };
                        },
                        pointToLayer: function(feature, latlng) {
                            return L.marker(latlng);
                        },
                        onEachFeature: function(feature, layer) {
                            // Her özelliği düzenlenebilir katmana ekle
                            drawnItems.addLayer(layer);

                            // Özellik bilgilerini popup olarak ekle
                            if (feature.properties) {
                                let popupContent = '<div style="max-height: 200px; overflow-y: auto;">';
                                for (let key in feature.properties) {
                                    if (feature.properties[key] !== null && feature.properties[key] !== '') {
                                        popupContent += `<b>${key}:</b> ${feature.properties[key]}<br>`;
                                    }
                                }
                                popupContent += '</div>';
                                layer.bindPopup(popupContent);
                            }
                        }
                    });

                    // Haritayı yüklenen veriye yakınlaştır
                    const bounds = drawnItems.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds);
                    }

                    updateFeatureCount();
                    updateLayerPanel();
                    alert('GeoJSON dosyası başarıyla yüklendi!');
                } catch (error) {
                    alert('GeoJSON dosyası yüklenirken hata oluştu: ' + error.message);
                }
            };
            reader.readAsText(file);

            // Input'u sıfırla (aynı dosyanın tekrar yüklenmesine izin ver)
            event.target.value = '';
        }

        // Leaflet GeometryUtil eklentisi (alan hesaplama için)
        L.GeometryUtil = L.extend(L.GeometryUtil || {}, {
            geodesicArea: function (latLngs) {
                let pointsCount = latLngs.length,
                    area = 0.0,
                    d2r = Math.PI / 180,
                    p1, p2;

                if (pointsCount > 2) {
                    for (let i = 0; i < pointsCount; i++) {
                        p1 = latLngs[i];
                        p2 = latLngs[(i + 1) % pointsCount];
                        area += ((p2.lng - p1.lng) * d2r) *
                                (2 + Math.sin(p1.lat * d2r) + Math.sin(p2.lat * d2r));
                    }
                    area = area * 6378137.0 * 6378137.0 / 2.0;
                }

                return Math.abs(area);
            }
        });

        // ============ LAYER PANEL ============
        function toggleLayerPanel() {
            const panel = document.getElementById('layerPanel');
            panel.classList.toggle('open');
        }

        function updateLayerPanel() {
            const layerList = document.getElementById('layerList');
            layerList.innerHTML = '';

            let layerIndex = 0;
            drawnItems.eachLayer(function(layer) {
                const layerId = L.stamp(layer);

                // Determine layer type and name
                let layerType = 'unknown';
                let layerName = 'Bilinmeyen';
                let layerColor = '#3498db';

                if (layer instanceof L.Circle) {
                    layerType = 'circle';
                    const radius = layer.getRadius();
                    layerName = `Daire (r=${radius.toFixed(0)}m)`;
                    layerColor = layer.options.color || '#27ae60';
                } else if (layer instanceof L.Polygon) {
                    layerType = 'polygon';
                    layerName = 'Poligon';
                    layerColor = layer.options.color || '#3498db';
                } else if (layer instanceof L.Polyline) {
                    layerType = 'polyline';
                    layerName = 'Çizgi';
                    layerColor = layer.options.color || '#e74c3c';
                } else if (layer instanceof L.Rectangle) {
                    layerType = 'rectangle';
                    layerName = 'Dikdörtgen';
                    layerColor = layer.options.color || '#9b59b6';
                } else if (layer instanceof L.Marker) {
                    if (layer.layerType === 'text') {
                        layerType = 'text';
                        layerName = layer.layerName || 'Text';
                    } else if (layer.iconSize) {
                        layerType = 'icon';
                        layerName = 'İnsan Simgesi';
                    } else {
                        layerType = 'marker';
                        layerName = 'İşaretçi';
                    }
                }

                layer._layerId = layerId;
                layer._layerType = layerType;
                layer._layerName = layerName;

                // Create layer item
                const layerItem = document.createElement('div');
                layerItem.className = 'layer-item';
                layerItem.innerHTML = `
                    <div class="layer-item-header">
                        <span class="layer-item-title">${layerIndex + 1}. ${layerName}</span>
                    </div>
                    <div class="layer-item-actions">
                        <button class="layer-btn layer-btn-toggle ${layer._isHidden ? 'hidden' : ''}" onclick="toggleLayerVisibility(${layerId})" title="Görünürlük">
                            ${layer._isHidden ? '👁️‍🗨️' : '👁️'}
                        </button>
                        ${layerType !== 'text' && layerType !== 'icon' && layerType !== 'marker' ? `
                        <input type="color" class="layer-btn-color" value="${layerColor}" onchange="changeLayerColor(${layerId}, this.value)" title="Renk">
                        ` : ''}
                        <button class="layer-btn layer-btn-delete" onclick="deleteLayer(${layerId})" title="Sil">🗑️</button>
                    </div>
                `;
                layerList.appendChild(layerItem);
                layerIndex++;
            });

            if (layerIndex === 0) {
                layerList.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Henüz katman yok</div>';
            }
        }

        function toggleLayerVisibility(layerId) {
            drawnItems.eachLayer(function(layer) {
                if (L.stamp(layer) === layerId) {
                    if (layer._isHidden) {
                        map.addLayer(layer);
                        layer._isHidden = false;
                    } else {
                        map.removeLayer(layer);
                        layer._isHidden = true;
                    }
                    updateLayerPanel();
                }
            });
        }

        function changeLayerColor(layerId, newColor) {
            drawnItems.eachLayer(function(layer) {
                if (L.stamp(layer) === layerId) {
                    if (layer.setStyle) {
                        layer.setStyle({
                            color: newColor,
                            fillColor: newColor
                        });
                    }
                }
            });
        }

        function deleteLayer(layerId) {
            if (confirm('Bu katmanı silmek istediğinize emin misiniz?')) {
                drawnItems.eachLayer(function(layer) {
                    if (L.stamp(layer) === layerId) {
                        drawnItems.removeLayer(layer);
                        updateFeatureCount();
                        updateLayerPanel();
                    }
                });
            }
        }

        // Close modals on outside click
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.style.display = 'none';
            }
        };

        // Sayfa yüklendiğinde özellik sayısını güncelle
        updateFeatureCount();
        updateLayerPanel();
    </script>
